name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and build HACS archive
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, zipfile
          tag = os.environ['GITHUB_REF_NAME']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Invalid release tag'
          root = pathlib.Path('custom_components/xiaozhi_mcp')
          assert json.loads((root / 'manifest.json').read_text())['version'] == tag[1:]
          notes = pathlib.Path('CHANGELOG.md').read_text().split('## [' + tag[1:] + ']', 1)[1]
          pathlib.Path('release-notes.md').write_text('## [' + tag[1:] + ']' + notes.split('\n## [', 1)[0])
          with zipfile.ZipFile('xiaozhi_mcp.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and '__pycache__' not in path.parts and path.suffix in ('.py', '.json', '.yaml'):
                      archive.write(path, path.relative_to(root))
          with zipfile.ZipFile('xiaozhi_mcp.zip') as archive:
              assert archive.testzip() is None
              assert {'manifest.json', '__init__.py', 'services.yaml'} <= set(archive.namelist())
          PY
          shasum -a 256 xiaozhi_mcp.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            xiaozhi_mcp.zip
            SHA256SUMS
          fail_on_unmatched_files: true
